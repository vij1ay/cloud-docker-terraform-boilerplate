name: Deploy to AWS EC2

on:
  workflow_run:
    workflows:
      - "Build & Push Docker Images"
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    # Only deploy when the build workflow succeeded (skip on manual dispatch)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Copy docker-compose and configs to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,mongo-init/"
          target: "/home/ubuntu/app"

      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # Log in to GitHub Container Registry
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull the latest images
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/backend:latest
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/frontend:latest

            # Navigate to the project directory
            cd /home/ubuntu/app

            # Write runtime environment variables
            cat > .env <<EOF
            MONGO_URL=${{ secrets.MONGO_URL }}
            API_URL=${{ secrets.API_URL }}
            BACKEND_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/backend:latest
            FRONTEND_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/frontend:latest
            EOF

            # Bring up services with zero-downtime replacement
            docker compose pull
            docker compose up -d --remove-orphans

            # Clean up dangling images to free disk space
            docker image prune -f
